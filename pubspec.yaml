name: aikit
description: Pure Dart Adobe Illustrator containers, compressed native programs, source-preserving layer edits, and typed AI7 artwork creation.
version: 0.1.0
publish_to: none
homepage: https://github.com/focale-editor/aikit
repository: https://github.com/focale-editor/aikit

topics:
  - illustrator
  - vector-graphics
  - codec
  - file-format

screenshots:
  - description: 'An Illustrator container represented by a document and a geometric A.'
    path: screenshots/overview.png

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  pdfcore:
    git:
      url: https://github.com/focale-editor/pdfcore.git
  pscore: ^0.2.2
  xml: '>=7.0.0 <8.0.0'
  zcodec: ^0.2.6

dev_dependencies:
  checks: ^0.3.2
  lints: ^6.1.0
  release: ^0.1.11
  test: ^1.32.0

release:
  changelog:
    header: '# 📰 AiKit changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
