name: aikit
description: Pure Dart Adobe Illustrator containers, compressed native programs, source-preserving native editing and serialization.
version: 0.1.0
homepage: https://github.com/focale-editor/aikit
repository: https://github.com/focale-editor/aikit

topics:
  - illustrator
  - vector-graphics
  - document
  - codec
  - file-format

screenshots:
  - description: 'A flat illustration of an Illustrator document with a geometric A.'
    path: screenshots/overview.png

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  pdfcore: ^0.1.0
  pscore: ^0.2.2
  xml: ^7.0.1
  zcodec: ^0.2.6

dev_dependencies:
  checks: ^0.3.2
  lints: ^6.1.0
  release: ^0.1.11
  test: ^1.32.0

release:
  changelog:
    header: '# 📰 AiKit changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
